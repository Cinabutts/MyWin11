name: Build Release

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'src/**'  # Auto-trigger on src changes

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        shell: pwsh
        run: |
          # Get the latest tag
          $latestTag = git describe --tags --abbrev=0 2>$null
          if (-not $latestTag) {
            $newVersion = "v1.0.0"
          } else {
            # Parse version (e.g., v1.2.3 -> 1.2.3)
            $version = $latestTag -replace '^v', ''
            $parts = $version.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]
            
            # Increment patch version
            $patch++
            $newVersion = "v$major.$minor.$patch"
          }
          
          echo "New version: $newVersion"
          echo "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Create src archive
        shell: pwsh
        run: |
          Compress-Archive -Path "src\*" -DestinationPath "MyWin11-src-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "MyWin11 Release ${{ steps.version.outputs.version }}"
          body: |
            MyWin11 tools and scripts collection.
            
            **What's included:**
            - Source code (automatic .zip and .tar.gz)
            - Individual src files as assets
            - Complete src folder as MyWin11-src-*.zip
            
            **Installation:**
            Download individual files or the complete archive.
          files: |
            MyWin11-src-${{ steps.version.outputs.version }}.zip
            src/*
          draft: false
          prerelease: false